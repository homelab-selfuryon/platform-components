name: Check

# Pull requests: per cluster `cue cmd render` and `cue cmd check` (cluster-scoped whitelist),
# kubeconform, the Kyverno policies over the render (scripts/kyverno-check.sh), the object diff against
# the base branch as a PR comment, and the workflow lint. Everything runs through this repository's
# devenv (`devenv shell -- ...`, the base profile: what CI needs). Nothing here is signed, so it is
# this repository's own workflow. `final-check` is the single required status check of the branch ruleset.
#
# Pushes to main run the same checks and keep what pull requests reuse: the Nix store of the devenv
# shell (cache-nix-action, saved from main only, so a pull request cannot write a cache main reads)
# and the render of each cluster (artifact `render-<cluster>`, the base side of the PR diff).

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

env:
  DEVENV_VERSION: v2.4.0

jobs:
  prepare:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      clusters: ${{ steps.list.outputs.clusters }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: clusters
      # Temporarily the directory listing, not `cue cmd clusters`: a `cue cmd` evaluates far more than
      # the command needs and took ~45 s with the devenv around it. Go back to `cue cmd clusters` (the
      # registry in clusters/clusters.cue is the source of truth) once a CUE release has the fix for
      # cue-lang/cue#4242 (on master, not in v0.18.0-rc.4) and ideally cue-lang/cue#4566.
      - name: List clusters
        id: list
        run: |
          set -euo pipefail
          clusters=$(find clusters -mindepth 2 -maxdepth 2 -name cluster.cue -printf '%h\n' | xargs -r -n1 basename | sort | jq -R . | jq -cs .)
          jq -e 'all(.[]; test("^[a-z][a-z0-9-]{1,40}$"))' <<<"$clusters" > /dev/null
          echo "clusters=${clusters}" >> "$GITHUB_OUTPUT"

  check:
    needs: prepare
    if: needs.prepare.outputs.clusters != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write # the diff comment
      actions: read # the base render from main's run
    strategy:
      matrix:
        cluster: ${{ fromJson(needs.prepare.outputs.clusters) }}
      fail-fast: false
    concurrency:
      group: components-check-${{ github.event.pull_request.number || github.sha }}-${{ matrix.cluster }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: devenv-${{ runner.os }}-${{ env.DEVENV_VERSION }}-${{ hashFiles('head/devenv.lock', 'head/devenv.nix', 'head/devenv.yaml') }}
          restore-prefixes-first-match: devenv-${{ runner.os }}-${{ env.DEVENV_VERSION }}-
          save: ${{ github.event_name == 'push' }}
          gc-max-store-size-linux: 4G
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv # read-only: the public devenv cache, no auth token
      - name: Install devenv
        run: |
          nix profile install --accept-flake-config --profile "$RUNNER_TEMP/devenv" "github:cachix/devenv/${DEVENV_VERSION}#devenv"
          echo "$RUNNER_TEMP/devenv/bin" >> "$GITHUB_PATH"

      - name: Render and check
        working-directory: head
        run: |
          set -euo pipefail
          devenv shell -- cue cmd render -t "cluster=${CLUSTER}"
          devenv shell -- cue cmd check -t "cluster=${CLUSTER}"
        env:
          CLUSTER: ${{ matrix.cluster }}

      - name: kubeconform
        working-directory: head
        run: |
          set -euo pipefail
          find "out/${CLUSTER}" -type f \( -name manifests.yaml -o -name kustomizations.yaml \) -not -path '*/.work/*' -not -path '*/.bootstrap/*' -print0 |
            xargs -0 --no-run-if-empty devenv shell -- kubeconform -strict -summary -ignore-missing-schemas \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
        env:
          CLUSTER: ${{ matrix.cluster }}

      # The rendered policies run over everything else the repository renders; the wrapper adds the
      # CRDs the render does not contain (Cilium).
      - name: Kyverno
        working-directory: head
        run: devenv shell -- scripts/kyverno-check.sh "$CLUSTER"
        env:
          CLUSTER: ${{ matrix.cluster }}

      # Main's render, the base side of later pull requests' diffs (hidden dirs .work/.bootstrap are left out).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: render-${{ matrix.cluster }}
          path: head/out/${{ matrix.cluster }}
          retention-days: 30
          if-no-files-found: error

      # Every render is split into one file per object (<set>/<namespace>/<kind>/<name>.yml), so the
      # diff shows objects, not file offsets. The base side is main's render of the base commit
      # (artifact of its Check run); without one, the base branch is rendered here with the head's
      # devenv. A cluster missing on the base side renders as empty.
      - name: Base render
        if: github.event_name == 'pull_request'
        working-directory: head
        run: |
          set -euo pipefail
          run_id=$(gh run list -R "$REPO" -w check.yaml -e push -c "$BASE_SHA" -L 1 --json databaseId -q '.[0].databaseId' || true)
          # shellcheck disable=SC2016 # the render command is expanded by the inner shell
          if [[ -n "$run_id" ]] && gh run download "$run_id" -R "$REPO" -n "render-${CLUSTER}" -D "../base/out/${CLUSTER}"; then
            echo "base: render of ${BASE_SHA} from run ${run_id}"
          elif devenv shell -- bash -c 'cd ../base && cue cmd render -t "cluster=${CLUSTER}"'; then
            echo "base: rendered here"
          else
            echo "::notice::${CLUSTER} does not render on the base branch, the diff shows everything as new"
            rm -rf ../base/out
          fi
        env:
          CLUSTER: ${{ matrix.cluster }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}

      - name: Lay out objects
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          for side in base head; do
            mkdir -p "$RUNNER_TEMP/diff/$side"
            [[ -d "$side/out/${CLUSTER}" ]] || continue
            while IFS= read -r -d '' f; do
              rel=$(dirname "${f#"$side/out/${CLUSTER}/"}" | tr -c 'A-Za-z0-9._/-' _)
              (cd "$RUNNER_TEMP/diff/$side" && PREFIX="$rel" yq -P -s \
                'strenv(PREFIX) + "/" + (.metadata.namespace // "_cluster") + "/" + (.kind | downcase) + "/" + .metadata.name' \
                'select(.kind != null) | sort_keys(..)' "$GITHUB_WORKSPACE/$f")
            done < <(find "$side/out/${CLUSTER}" -type f -name '*.yaml' ! -name kustomization.yaml -not -path '*/.work/*' -not -path '*/.bootstrap/*' -print0)
          done
        env:
          CLUSTER: ${{ matrix.cluster }}

      - name: Generate diff
        id: diff
        if: github.event_name == 'pull_request'
        uses: int128/diff-action@7d157ee0e4e33a930be4a424f41e805390f0ff19 # v2.43.0
        with:
          head: ${{ runner.temp }}/diff/head
          base: ${{ runner.temp }}/diff/base

      - uses: int128/comment-action@304df51b76a99f2ba948f8d780d789b5ecc22893 # v1.80.0
        if: steps.diff.outputs.comment-body != ''
        with:
          update-if-exists: replace
          update-if-exists-key: ${{ matrix.cluster }}
          post: |
            ## Object diff: `${{ matrix.cluster }}`
            ${{ steps.diff.outputs.comment-body }}

  lint:
    permissions:
      contents: read
    uses: homelab-selfuryon/github-workflows/.github/workflows/lint-workflows.yaml@c49b40a6acc765b064daff0e0e8e9c3bc6486a37 # v1.0.1

  final-check:
    if: always()
    needs: [prepare, check, lint]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded or was skipped
        run: |
          [[ "$NEEDS" == *'"result": "failure"'* || "$NEEDS" == *'"result": "cancelled"'* ]] && { echo "$NEEDS"; exit 1; }
          exit 0
        env:
          NEEDS: ${{ toJSON(needs) }}
