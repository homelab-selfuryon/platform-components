name: Release

# Pushes to main: publish one signed artifact per set and cluster
# (ghcr.io/homelab-selfuryon/platform-components/<cluster>-<set>) and open the PR to gitops that moves
# the digests (octo-sts identity `components-release`, no auto-merge: platform approves).
#
# Set content hash: sha256 of the sorted, uncompressed tar of out/<cluster>/<set>/, first 16 hex
# characters; a set whose tag exists is not pushed again.
#
# The signing job is defined in THIS file, not in a reusable workflow: the certificate subject is
# https://github.com/homelab-selfuryon/platform-components/.github/workflows/release.yaml@refs/heads/main,
# which is what Flux verifies. A workflow on any other branch cannot produce an artifact Flux accepts.

on:
  push:
    branches: [main]

permissions: {}

env:
  DEVENV_VERSION: v2.4.0
  REGISTRY: ghcr.io/homelab-selfuryon

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      clusters: ${{ steps.list.outputs.clusters }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv # read-only: the public devenv cache, no auth token
      - name: Install devenv
        run: |
          nix profile install --accept-flake-config --profile "$RUNNER_TEMP/devenv" "github:cachix/devenv/${DEVENV_VERSION}#devenv"
          echo "$RUNNER_TEMP/devenv/bin" >> "$GITHUB_PATH"

      - name: Clusters to publish
        id: list
        run: |
          set -euo pipefail
          # [{"name": "alpha-01", "publish": true}, ...]
          clusters=$(devenv shell -- cue cmd clusters | jq -c '[.[] | select(.publish == true) | .name]')
          jq -e 'all(.[]; test("^[a-z][a-z0-9-]{1,40}$"))' <<<"$clusters" > /dev/null
          echo "clusters=${clusters}" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    if: needs.prepare.outputs.clusters != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push the set artifacts
      id-token: write # keyless cosign, octo-sts
    strategy:
      matrix:
        cluster: ${{ fromJson(needs.prepare.outputs.clusters) }}
      fail-fast: false
    concurrency:
      group: components-release-${{ matrix.cluster }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv # read-only: the public devenv cache, no auth token
      - name: Install devenv
        run: |
          nix profile install --accept-flake-config --profile "$RUNNER_TEMP/devenv" "github:cachix/devenv/${DEVENV_VERSION}#devenv"
          echo "$RUNNER_TEMP/devenv/bin" >> "$GITHUB_PATH"

      # ~/.docker/config.json: read by buildx, oras and cue (platform-kit comes from GHCR).
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Render and check
        run: |
          set -euo pipefail
          devenv shell -- cue cmd render -t "cluster=${CLUSTER}"
          devenv shell -- cue cmd check -t "cluster=${CLUSTER}"
        env:
          CLUSTER: ${{ matrix.cluster }}

      - name: Push and sign the changed sets
        run: |
          set -euo pipefail
          releases="$RUNNER_TEMP/releases.json"
          echo '{}' > "$releases"
          for dir in "out/${CLUSTER}"/*/; do
            set_name=$(basename "$dir")
            [[ "$set_name" =~ ^[a-z][a-z0-9-]{1,40}$ ]]
            repo="${REGISTRY}/platform-components/${CLUSTER}-${set_name}"
            tar_args=(--sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C "out/${CLUSTER}/${set_name}" -cf - .)
            hash=$(tar "${tar_args[@]}" | sha256sum | cut -c1-16)
            if digest=$(oras resolve "${repo}:${hash}" 2>/dev/null); then
              echo "${set_name}: ${hash} exists, not pushed again"
            else
              tar "${tar_args[@]}" | gzip -n > "$RUNNER_TEMP/${set_name}.tar.gz"
              (cd "$RUNNER_TEMP" && oras push "${repo}:${hash}" \
                --artifact-type application/vnd.homelab-selfuryon.components.v1 \
                --format json \
                "${set_name}.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip") > "$RUNNER_TEMP/push.json"
              digest=$(jq -r .digest "$RUNNER_TEMP/push.json")
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
              cosign sign --yes "${repo}@${digest}"
              echo "${set_name}: pushed ${hash}"
            fi
            jq --arg s "$set_name" --arg v "$hash" --arg d "$digest" '.[$s] = {version: $v, digest: $d}' \
              "$releases" > "$releases.new" && mv "$releases.new" "$releases"
          done
          jq -S . "$releases" > "$RUNNER_TEMP/releases.sorted.json"
        env:
          CLUSTER: ${{ matrix.cluster }}

      - name: Token for gitops
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: homelab-selfuryon/gitops
          identity: components-release

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: homelab-selfuryon/gitops
          path: gitops
          token: ${{ steps.octo-sts.outputs.token }}
          persist-credentials: false

      - name: Update releases.json
        run: |
          set -euo pipefail
          file="gitops/clusters/${CLUSTER}/releases.json"
          [[ -f "$file" ]] || { echo "::error::cluster ${CLUSTER} is not registered in gitops"; exit 1; }
          # Keep the key order of the existing file so the PR diff shows only changed sets.
          jq --slurpfile new "$RUNNER_TEMP/releases.sorted.json" '. as $old | reduce ($new[0] | keys_unsorted[]) as $k ($old; .[$k] = $new[0][$k])' "$file" > "$file.new"
          mv "$file.new" "$file"
          echo "BODY_FILE=$RUNNER_TEMP/pr-body.md" >> "$GITHUB_ENV"
          {
            echo "Platform sets of \`${CLUSTER}\` built from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}."
            echo
            echo '```json'
            cat "$file"
            echo '```'
            echo
            echo "workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$RUNNER_TEMP/pr-body.md"
        env:
          CLUSTER: ${{ matrix.cluster }}

      - name: Open the PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: gitops
          token: ${{ steps.octo-sts.outputs.token }}
          branch: release/platform-components/${{ matrix.cluster }}
          sign-commits: true
          delete-branch: true
          add-paths: clusters/${{ matrix.cluster }}/releases.json
          title: "release(${{ matrix.cluster }}): platform sets"
          commit-message: "release(${{ matrix.cluster }}): platform sets"
          body-path: ${{ env.BODY_FILE }}

  final-check:
    if: always()
    needs: [prepare, release]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded or was skipped
        run: |
          [[ "$NEEDS" == *'"result": "failure"'* || "$NEEDS" == *'"result": "cancelled"'* ]] && { echo "$NEEDS"; exit 1; }
          exit 0
        env:
          NEEDS: ${{ toJSON(needs) }}
