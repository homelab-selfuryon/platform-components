name: Release

# Pushes to main: publish one signed artifact per cluster, a directory per set
# (ghcr.io/homelab-selfuryon/platform-components/<cluster>) and open the PR to gitops that moves
# its digest (octo-sts identity `components-release`, no auto-merge: platform approves).
#
# Content hash: sha256 of the sorted, uncompressed tar of the set directories in out/<cluster>/, first 16 hex
# characters; a tag that exists is not pushed again.
#
# The signing job is defined in THIS file, not in a reusable workflow: the certificate subject is
# https://github.com/homelab-selfuryon/platform-components/.github/workflows/release.yaml@refs/heads/main,
# which is what Flux verifies. A workflow on any other branch cannot produce an artifact Flux accepts.

on:
  push:
    branches: [main]

permissions: {}

env:
  DEVENV_VERSION: v2.4.0
  REGISTRY: ghcr.io/homelab-selfuryon

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      clusters: ${{ steps.list.outputs.clusters }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv # read-only: the public devenv cache, no auth token
      - name: Install devenv
        run: |
          nix profile install --accept-flake-config --profile "$RUNNER_TEMP/devenv" "github:cachix/devenv/${DEVENV_VERSION}#devenv"
          echo "$RUNNER_TEMP/devenv/bin" >> "$GITHUB_PATH"

      - name: Clusters to publish
        id: list
        run: |
          set -euo pipefail
          # [{"name": "alpha-01", "publish": true}, ...]
          clusters=$(devenv shell -- cue cmd clusters | jq -c '[.[] | select(.publish == true) | .name]')
          jq -e 'all(.[]; test("^[a-z][a-z0-9-]{1,40}$"))' <<<"$clusters" > /dev/null
          echo "clusters=${clusters}" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    if: needs.prepare.outputs.clusters != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push the cluster artifact
      id-token: write # keyless cosign, octo-sts
    strategy:
      matrix:
        cluster: ${{ fromJson(needs.prepare.outputs.clusters) }}
      fail-fast: false
    concurrency:
      group: components-release-${{ matrix.cluster }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv # read-only: the public devenv cache, no auth token
      - name: Install devenv
        run: |
          nix profile install --accept-flake-config --profile "$RUNNER_TEMP/devenv" "github:cachix/devenv/${DEVENV_VERSION}#devenv"
          echo "$RUNNER_TEMP/devenv/bin" >> "$GITHUB_PATH"

      # ~/.docker/config.json: read by buildx, oras and cue (platform-kit comes from GHCR).
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2.0.4

      - name: Render and check
        run: |
          set -euo pipefail
          devenv shell -- cue cmd render -t "cluster=${CLUSTER}"
          devenv shell -- cue cmd check -t "cluster=${CLUSTER}"
        env:
          CLUSTER: ${{ matrix.cluster }}

      - name: Push and sign the cluster artifact
        run: |
          set -euo pipefail
          # The set directories only (not bootstrap.yaml, not the scratch dirs).
          mapfile -t sets < <(devenv shell -- cue cmd clusters | jq -r --arg c "$CLUSTER" '.[] | select(.name == $c) | .sets[]')
          [[ ${#sets[@]} -gt 0 ]]
          for s in "${sets[@]}"; do
            [[ "$s" =~ ^[a-z][a-z0-9-]{1,40}$ && -d "out/${CLUSTER}/${s}" ]]
          done
          repo="${REGISTRY}/platform-components/${CLUSTER}"
          tar_args=(--sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C "out/${CLUSTER}" -cf - "${sets[@]}")
          hash=$(tar "${tar_args[@]}" | sha256sum | cut -c1-16)
          if digest=$(oras resolve "${repo}:${hash}" 2>/dev/null); then
            echo "${hash} exists, not pushed again"
          else
            tar "${tar_args[@]}" | gzip -n > "$RUNNER_TEMP/${CLUSTER}.tar.gz"
            (cd "$RUNNER_TEMP" && oras push "${repo}:${hash}" \
              --artifact-type application/vnd.homelab-selfuryon.components.v1 \
              --format json \
              "${CLUSTER}.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip") > "$RUNNER_TEMP/push.json"
            digest=$(jq -r .digest "$RUNNER_TEMP/push.json")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            cosign sign --yes "${repo}@${digest}"
            echo "pushed ${hash}"
          fi
          jq -n --arg v "$hash" --arg d "$digest" '{version: $v, digest: $d}' > "$RUNNER_TEMP/release.json"
        env:
          CLUSTER: ${{ matrix.cluster }}

      - name: Token for gitops
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: homelab-selfuryon/gitops
          identity: components-release

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: homelab-selfuryon/gitops
          path: gitops
          token: ${{ steps.octo-sts.outputs.token }}
          persist-credentials: false

      - name: Update releases.json
        run: |
          set -euo pipefail
          file="gitops/clusters/${CLUSTER}/releases.json"
          [[ -f "$file" ]] || { echo "::error::cluster ${CLUSTER} is not registered in gitops"; exit 1; }
          cp "$RUNNER_TEMP/release.json" "$file"
          echo "BODY_FILE=$RUNNER_TEMP/pr-body.md" >> "$GITHUB_ENV"
          {
            echo "Platform of \`${CLUSTER}\` built from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}."
            echo
            echo '```json'
            cat "$file"
            echo '```'
            echo
            echo "workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$RUNNER_TEMP/pr-body.md"
        env:
          CLUSTER: ${{ matrix.cluster }}

      - name: Open the PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          path: gitops
          token: ${{ steps.octo-sts.outputs.token }}
          branch: release/platform-components/${{ matrix.cluster }}
          sign-commits: true
          delete-branch: true
          add-paths: clusters/${{ matrix.cluster }}/releases.json
          title: "release(${{ matrix.cluster }}): platform"
          commit-message: "release(${{ matrix.cluster }}): platform"
          body-path: ${{ env.BODY_FILE }}

  final-check:
    if: always()
    needs: [prepare, release]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded or was skipped
        run: |
          [[ "$NEEDS" == *'"result": "failure"'* || "$NEEDS" == *'"result": "cancelled"'* ]] && { echo "$NEEDS"; exit 1; }
          exit 0
        env:
          NEEDS: ${{ toJSON(needs) }}
