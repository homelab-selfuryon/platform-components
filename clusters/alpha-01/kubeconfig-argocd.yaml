# Kubeconfig for the argocd CLI (the `argocd` wrapper in devenv.nix), merged in front of the admin
# kubeconfig from the break-glass bundle (.secrets/kubernetes/config: cluster `alpha-01`, user
# `admin@alpha-01`, the node's ULA address). No credentials here: the context only names a cluster,
# a user and a namespace.
#
# Argo CD has no API server here, so the CLI runs in core mode and talks to Kubernetes directly. It
# takes Argo CD's namespace from the current context only (`--kube-context` does not change it),
# hence a separate file with its own current-context.
apiVersion: v1
kind: Config
current-context: alpha-01-argocd
contexts:
  - name: alpha-01-argocd
    context:
      cluster: alpha-01
      user: admin@alpha-01
      namespace: argocd-system
