apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  # Vanilla (empty) schematic of the Image Factory: no extensions. Pin your own schematic ID if
  # you need extensions, and keep the version in step with talosctl.
  image: factory.talos.dev/metal-installer/376567988ad370138ad8b2698212367b8edcb69b5fd68c80be1f2ec7d603b4ba:v1.14.5
provisioning:
  # The install disk, matched by a stable symlink so a USB stick is never picked. The real ID is a
  # hardware serial: it comes from the git-ignored .secrets/talos/<cluster>/local.yaml (gen.sh).
  # `talosctl get disks --insecure -n <node>` lists them.
  diskSelector:
    match: "'/dev/disk/by-id/REPLACE-WITH-DISK-ID' in disk.symlinks"
  wipe: true
---
# Cap /var so the rest of the system disk is left for local storage. Not encrypted yet: see
# encryption.yaml.
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: system_disk
  maxSize: 64GiB
  grow: false
---
# Mounted at /var/mnt/local-storage (backs the local-path StorageClass), takes the remaining space
# on the system disk.
apiVersion: v1alpha1
kind: UserVolumeConfig
name: local-storage
provisioning:
  diskSelector:
    match: system_disk
  minSize: 10GiB
  grow: true
filesystem:
  type: xfs
  projectQuotaSupport: true
